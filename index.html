<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Deteksi Sensorik - Gestur Tangan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Container Utama -->
    <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700">
        
        <!-- Title -->
        <h1 class="text-2xl font-bold text-center text-indigo-400 mb-1">
            Teachable Machine Image Model
        </h1>
        <p class="text-slate-400 text-center text-xs mb-6">
            Deteksi Gestur Tangan (3 Jari & 5 Jari)
        </p>

        <!-- Tombol Start -->
        <div class="flex justify-center mb-6">
            <button type="button" onclick="init()" id="start-btn" 
                    class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-6 py-2.5 rounded-lg shadow-md transition duration-200 cursor-pointer">
                Start Kamera
            </button>
        </div>

        <!-- Area Webcam -->
        <div class="flex flex-col items-center mb-6">
            <div id="webcam-container" 
                 class="w-[200px] h-[200px] bg-slate-900 rounded-xl flex items-center justify-center border border-slate-700 overflow-hidden shadow-inner">
                <span id="placeholder-text" class="text-slate-500 text-xs text-center p-4">
                    Kamera belum aktif.<br>Klik "Start Kamera" di atas.
                </span>
            </div>
        </div>

        <!-- Area Hasil Prediksi / Label -->
        <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/60">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 border-b border-slate-700 pb-1">
                Hasil Deteksi:
            </h2>
            <div id="label-container" class="space-y-2 text-sm font-medium text-slate-200">
                <!-- Label prediksi akan muncul di sini -->
            </div>
        </div>

    </div>

    <!-- Script TensorFlow & Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <!-- Program JavaScript Teachable Machine -->
    <script type="text/javascript">
        // More API functions here:
        // https://github.com/googlecreativelab/teachablemachine-community/tree/master/libraries/image

        // the link to your model provided by Teachable Machine export panel
        const URL = "./my_model/";

        let model, webcam, labelContainer, maxPredictions;

        // Load the image model and setup the webcam
        async function init() {
            const btn = document.getElementById("start-btn");
            btn.innerText = "Loading Model...";
            btn.disabled = true;

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true; 
            webcam = new tmImage.Webcam(200, 200, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            
            const webcamContainer = document.getElementById("webcam-container");
            webcamContainer.innerHTML = "";
            webcamContainer.appendChild(webcam.canvas);

            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = "";
            for (let i = 0; i < maxPredictions; i++) { 
                const div = document.createElement("div");
                div.className = "bg-slate-800 px-3 py-2 rounded-lg border border-slate-700 text-slate-200 flex justify-between items-center";
                labelContainer.appendChild(div);
            }

            btn.innerText = "Kamera Aktif";
            btn.className = "bg-emerald-600 text-white font-semibold px-6 py-2.5 rounded-lg shadow-md cursor-default";
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        // run the webcam image through the image model
        async function predict() {
            // predict can take in an image, video or canvas html element
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const classPrediction =
                    prediction[i].className + ": " + prediction[i].probability.toFixed(2);
                labelContainer.childNodes[i].innerHTML = classPrediction;
            }
        }
    </script>
</body>
</html>
